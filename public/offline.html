<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#C96A3D" />
    <title>Sera</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f5f0e8;
        color: #1e1e1e;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px;
        text-align: center;
      }

      .mark {
        width: 72px;
        height: 72px;
        border-radius: 24px;
        display: grid;
        place-items: center;
        background: #1e1e1e;
        color: #f5f0e8;
        font: 700 42px Georgia, serif;
        box-shadow: 0 18px 50px rgba(70, 81, 62, 0.18);
      }

      h1 {
        margin: 20px 0 8px;
        font: 500 48px Georgia, serif;
      }

      p {
        margin: 0;
        max-width: 280px;
        color: #70675d;
        line-height: 1.55;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">S</div>
      <h1>Sera</h1>
      <p>Your dinner journal is available offline. Reconnect to refresh the latest plan.</p>
    </main>
  </body>
</html>
